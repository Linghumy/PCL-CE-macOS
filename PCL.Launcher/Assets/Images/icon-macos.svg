<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="220" y1="120" x2="804" y2="904"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d4f9e"/>
      <stop offset="0.52" stop-color="#0068de"/>
      <stop offset="1" stop-color="#003b86"/>
    </linearGradient>
    <linearGradient id="backLayer" x1="270" y1="190" x2="740" y2="735"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#168ef5"/>
      <stop offset="1" stop-color="#0057c8"/>
    </linearGradient>
    <linearGradient id="frontLayer" x1="290" y1="286" x2="745" y2="760"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b79ea"/>
      <stop offset="1" stop-color="#004aab"/>
    </linearGradient>
    <clipPath id="iconShape">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconShape)">
    <rect x="100" y="100" width="824" height="824" fill="url(#background)"/>

    <!-- 保留原 Logo 的层叠方块轮廓，同时扩大安全区，避免在 Dock 中显得松散。 -->
    <rect x="226" y="194" width="548" height="548" rx="112"
          fill="#002957" transform="rotate(-7 500 468)"/>
    <rect x="254" y="206" width="548" height="548" rx="112"
          fill="url(#backLayer)" transform="rotate(6 528 480)"/>
    <rect x="232" y="282" width="560" height="492" rx="88"
          fill="url(#frontLayer)"/>

    <g fill="#ffffff"
       font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
       font-weight="700"
       text-anchor="middle">
      <text x="512" y="510" font-size="224" letter-spacing="-13">PCL</text>
      <text x="512" y="672" font-size="102" letter-spacing="3">CE</text>
    </g>
  </g>
</svg>
